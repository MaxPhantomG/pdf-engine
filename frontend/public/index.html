<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <title>PDF Engine - CLI</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="stylesheet" href="src/styles.css">
</head>
<body>
  <div id="app">
    <!-- аутентификация -->
    <section id="auth-section">
      <form id="auth-form" class="form" autocomplete="off">
        <div class="form-row">
          <label>Имя пользователя
            <input id="username" type="text" required />
          </label>
          <label>Пароль
            <input id="password" type="password" required />
          </label>
        </div>
        <div class="actions">
          <button type="submit" id="login-btn">Войти</button>
          <button type="submit" id="register-btn" class="secondary">Регистрация</button>
        </div>
        <div id="auth-message" class="message"></div>
      </form>
    </section>


    <section id="app-section" class="hidden">
      <button id="logout-btn" class="secondary">Выйти</button>


      <section id="upload-section" class="section">
        <form id="upload-form" class="form" enctype="multipart/form-data">
          <input id="pdf-files" type="file" multiple accept="application/pdf" />
          <button type="submit">Загрузить PDF</button>
          <div id="upload-message" class="message"></div>
        </form>
      </section>

      <section id="documents-section" class="section">
        <button id="refresh-docs-btn">Обновить список</button>
        <div id="documents-list"></div>
      </section>

    <div id="document-modal" class="modal hidden">
      <div class="modal-overlay"></div>
      <div class="modal-content">
        <div class="modal-header">
          <h2 id="modal-document-name">Название документа</h2>
          <button id="modal-close" class="close-btn">&times;</button>
        </div>
        

        <div class="modal-search">
          <form id="modal-search-form" class="form-inline">
            <input id="modal-search-query" type="text" placeholder="Поиск в документе" />
            <button type="submit">Найти</button>
          </form>
          <div id="modal-search-message" class="message"></div>
          <div id="modal-search-results" class="search-results"></div>
        </div>
        
        <!-- Содержимое документа -->
        <div class="modal-body">
          <div id="modal-document-content" class="document-content"></div>
        </div>
      </div>
    </div>
  </div>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
